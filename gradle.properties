org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The one place the version is written. Consumed by desktop packageVersion and
# by the Android versionName/versionCode, so an installer can never again claim
# to be a new release while reporting the old ProductVersion to Windows.
#
# Bump this for every build you hand to someone. MSI major upgrades are driven
# entirely by ProductVersion increasing: with an unchanged version Windows sees
# the same product already installed and offers Remove/Repair instead.
resonateVersion=1.19.0
